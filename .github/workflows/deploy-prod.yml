name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  sync-to-ncp-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"

      - name: Add NCP SourceCommit remote
        run: |
          git remote add ncp https://${{ secrets.NCP_GIT_USERNAME }}:${{ secrets.NCP_GIT_PASSWORD }}@devtools.ncloud.com/3067145/contest24-repo-backend.git

      - name: Push main to NCP master (Production)
        run: |
          echo "Syncing GitHub main to NCP SourceCommit master (Production)..."
          git push ncp main:master --force
          echo "Successfully synced to NCP SourceCommit for Production deployment!"
        env:
          GIT_TERMINAL_PROMPT: 0

      - name: Notify production deployment
        run: |
          echo "Production deployment pipeline triggered!"
          echo "Deploying to contest-24-node-2-w-d514 node"
          echo "Check NKS SourceDeploy for build and deployment progress."