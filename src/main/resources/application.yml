spring:
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/improfessor?allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: 6379

  mail:
    username: ${EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  jwt:
    secret: ${JWT_SECRET_KEY}

logging:
  level:
    org.hibernate.sql: debug

gemini:
  api:
    key: ${GEMINI_API_KEY}
    timeout: 30
    base-url: https://generativelanguage.googleapis.com

cache:
  type: caffeine  # caffeine 또는 redis
  caffeine:
    maximum-size: 200        # 최대 캐시 항목 수
    expire-after-write: 2h    # 2시간 후 만료