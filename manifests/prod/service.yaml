apiVersion: v1
kind: Service
metadata:
  name: contest24-backend-prod-service
  namespace: default
  labels:
    app: contest24-backend
    environment: production
spec:
  type: NodePort
  selector:
    app: contest24-backend
    environment: production
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080