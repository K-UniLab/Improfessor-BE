apiVersion: apps/v1
kind: Deployment
metadata:
  name: contest24-backend-prod
  namespace: default
  labels:
    app: contest24-backend
    environment: production
    version: latest
spec:
  replicas: 2 # 운영환경 로드밸런싱 및 무중단 배포

  # 무중단 배포 전략 설정
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1      # 최대 1개 Pod까지 중단 허용
      maxSurge: 1           # 최대 1개 Pod 추가 생성 허용

  selector:
    matchLabels:
      app: contest24-backend
      environment: production
  template:
    metadata:
      labels:
        app: contest24-backend
        environment: production
        version: latest
    spec:
      # 운영 노드 고정 배포
      nodeSelector:
        kubernetes.io/hostname: "contest-24-node-2-w-d514"

      containers:
        - name: contest24-backend
          image: contest24-registry.kr.ncr.ntruss.com/contest24-backend-prod:latest

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # 환경별 Secret/ConfigMap 주입
          envFrom:
            - secretRef:
                name: contest24-secrets
            - configMapRef:
                name: contest24-config-prod     # 운영환경 전용 ConfigMap

          env:
            - name: SERVER_PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "production"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512m -Xmx768m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC"

          # 리소스 제한 (노드 리소스 고려한 안전한 설정)
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

          # 무중단 배포를 위한 헬스체크 설정
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18  # 3분 대기

      # 컨테이너 레지스트리 인증
      imagePullSecrets:
        - name: regcred

      # 재시작 정책
      restartPolicy: Always

      # Pod 안전한 종료를 위한 설정
      terminationGracePeriodSeconds: 60