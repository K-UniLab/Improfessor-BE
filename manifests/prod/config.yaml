# config-prod.yaml - 설정 관련 정보 (민감하지 않지만 환경별로 다름)
apiVersion: v1
kind: ConfigMap
metadata:
  name: contest24-config-prod
  labels:
    app: contest24-backend
    environment: production
data:
  # MySQL 데이터베이스 이름
  MYSQL_DATABASE: "improfessor"

  # 데이터베이스 URL
  MYSQL_URL: "jdbc:mysql://mysql-service:3306/improfessor?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&connectTimeout=60000&socketTimeout=60000&tcpKeepAlive=true&tcpRcvBuf=32768&tcpSndBuf=32768&tcpTrafficClass=0"

  # Redis 설정
  REDIS_HOST: "redis-service"

  # 서버 URL
  SERVER_URL: "https://prod.improfessor.kro.kr"

  # OAuth2 리다이렉트 URI
  KAKAO_REDIRECT_URI: "https://prod.improfessor.kro.kr/login/oauth2/code/kakao"
  AUTHORIZED_REDIRECT_URI: "https://improfessor.vercel.app/generate"