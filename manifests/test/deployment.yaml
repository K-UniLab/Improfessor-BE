apiVersion: apps/v1
kind: Deployment
metadata:
  name: contest24-backend-test
  namespace: default
  labels:
    app: contest24-backend
    environment: test
    version: latest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contest24-backend
      environment: test
  template:
    metadata:
      labels:
        app: contest24-backend
        environment: test
        version: latest
    spec:
      # 테스트 노드 고정 배포
      nodeSelector:
        kubernetes.io/hostname: "contest-24-node-w-53d9"

      containers:
        - name: contest24-backend
          image: contest24-registry.kr.ncr.ntruss.com/contest24-backend:latest

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # 🔧 환경별 Secret/ConfigMap 주입
          envFrom:
            - secretRef:
                name: contest24-secrets-test    # 테스트 전용 Secret
            - configMapRef:
                name: contest24-config-test     # 테스트 전용 ConfigMap

          env:
            - name: SERVER_PORT
              value: "8080"
            - name: ENVIRONMENT
              value: "test"

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"

      # 컨테이너 레지스트리 인증
      imagePullSecrets:
        - name: regcred

      # 재시작 정책
      restartPolicy: Always