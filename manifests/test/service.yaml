apiVersion: v1
kind: Service
metadata:
  name: contest24-backend-test-service
  namespace: default
  labels:
    app: contest24-backend
    environment: test
spec:
  type: NodePort
  selector:
    app: contest24-backend
    environment: test
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080